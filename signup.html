<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROMS - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page" data-page="signup">
  <main class="auth-card">
    <a class="brand" href="/">ROMS</a>
    <p class="eyebrow">Tenant account</p>
    <h1>Create your account</h1>
    <p class="muted">Tenants can report problems, read notices and track their rent.</p>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <form id="signupForm" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" minlength="2" maxlength="60" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required>
      <label for="room">Room number</label>
      <input id="room" name="room" type="text" maxlength="20" placeholder="e.g. 101" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <p class="field-hint">Use at least 8 characters.</p>
      <label for="confirmPassword">Confirm password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
      <button class="button primary full" type="submit">Create tenant account</button>
    </form>
    <p class="auth-switch">Already registered? <a href="index.html">Sign in</a></p>
  </main>
  <script src="auth.js"></script>
</body>
</html>
